; SmartPendant Large — Elecrow CrowPanel Advance
; Default: 5″ ST7262 IPS 800×480 → portrait UI 480×800
; Alternate: 7″ GW1076-i2 (same chrome; different RGB timing)
; MCU: ESP32-S3-WROOM-1-N16R8 (16MB flash + 8MB OPI PSRAM)
; Touch: GT911 (I2C 0x5D)
; Backlight: STC8H1K28 (I2C 0x30)

[platformio]
default_envs = crowpanel-advance-5
packages_dir = .pio/packages
platforms_dir = .pio/platforms
cache_dir = .pio/cache

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_ram_size = 8519680
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
custom_sdkconfig = CONFIG_SPIRAM_XIP_FROM_PSRAM=y

lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.2.29

build_flags =
    -DBOARD_HAS_PSRAM
    -I include
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DVERSION=\"0.52.1\"
    -Os
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED

; ---------------------------------------------------------------------------
; CrowPanel Advance 5" (ST7262 IPS) — default
; Backlight: STC8H1K28 @ 0x30, brightness 0x00=max … 0xF5=off
; ---------------------------------------------------------------------------
[env:crowpanel-advance-5]
build_unflags =
    -Werror=all
build_flags =
    ${env.build_flags}
    -DHARDWARE_ADVANCE
    -DPANEL_ST7262=1
    -DBACKLIGHT_I2C
    -DBACKLIGHT_I2C_ADDR=0x30
    -DADVANCE_BL_V13=1
    -DPORTRAIT_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; ---------------------------------------------------------------------------
; CrowPanel Advance 7" v1.3+ (GW1076-i2 IPS) — large-screen alternate
; ---------------------------------------------------------------------------
[env:crowpanel-advance-7-v13]
build_unflags =
    -Werror=all
build_flags =
    ${env.build_flags}
    -DHARDWARE_ADVANCE
    -DPANEL_GW1076=1
    -DBACKLIGHT_I2C
    -DBACKLIGHT_I2C_ADDR=0x30
    -DADVANCE_BL_V13=1
    -DPORTRAIT_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; ---------------------------------------------------------------------------
; CrowPanel Advance 7" v1.2 (older backlight protocol)
; ---------------------------------------------------------------------------
[env:crowpanel-advance-7-v12]
build_unflags =
    -Werror=all
build_flags =
    ${env.build_flags}
    -DHARDWARE_ADVANCE
    -DPANEL_GW1076=1
    -DBACKLIGHT_I2C
    -DBACKLIGHT_I2C_ADDR=0x30
    -DADVANCE_BL_V12=1
    -DPORTRAIT_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
