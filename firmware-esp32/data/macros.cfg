# Soft macros — edit this file and reboot (no rebuild).
# Prefer SD card copy at /macros.cfg (wins over LittleFS).
#
# Format:
#   Name = g-code
# Use ; to chain a few short commands on one button.
# Names should stay short (button labels, ~10 chars).
#
# Examples (adjust coordinates to your machine):

XY0 = G90 G0 X0 Y0
Park = G90 G0 X0 Y0
Z0 = G90 G0 Z0
Unlock = $X
