# CrowPanel Advance 7.0" (GW1076-i2) — same UART1-OUT / TF map as 5"
# Note: LCD RGB timing still comes from the firmware binary you flashed
# (crowpanel-advance-5 vs crowpanel-advance-7-*). Pin/laser settings are runtime.
name CrowPanel Advance 7" (GW1076-i2)
uart.num 1
uart.tx 20
uart.rx 19
uart.baud 115200
laser.enable_dout 0
laser.feed_pct 5.0
laser.s_max 1000
handwheel.a -1
handwheel.b -1
handwheel.ppr 100
i2c_mpg.enable 0
i2c_mpg.addr 0x20
sd.enable 1
sd.mosi 6
sd.miso 4
sd.sck 5
sd.cs -1
sd.dummy_cs 8
