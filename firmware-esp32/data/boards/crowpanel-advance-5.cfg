# CrowPanel Advance 5.0" (ST7262) — UART1-OUT + TF SPI pin map
name CrowPanel Advance 5" (ST7262)
uart.num 1
uart.tx 20
uart.rx 19
uart.baud 115200
laser.enable_dout 0
laser.feed_pct 5.0
laser.s_max 1000
handwheel.a -1
handwheel.b -1
handwheel.ppr 100
i2c_mpg.enable 0
i2c_mpg.addr 0x20
sd.enable 1
sd.mosi 6
sd.miso 4
sd.sck 5
sd.cs -1
sd.dummy_cs 8
