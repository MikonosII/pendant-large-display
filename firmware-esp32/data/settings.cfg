# SmartPendant runtime settings — edit and reboot. No rebuild required.
#
# Preferred: copy this file to the TF/SD card as /settings.cfg
# (SD wins over the LittleFS copy flashed with the binary).
#
# Built-in boards:
#   crowpanel-advance-5   — CrowPanel Advance 5" ST7262 (default)
#   crowpanel-advance-7   — CrowPanel Advance 7" GW1076-i2
# Optional pin maps: /boards/<id>.cfg on SD or LittleFS

board crowpanel-advance-5

# --- Optional overrides (uncomment to change board defaults) ---
# uart.tx 20
# uart.rx 19
# uart.baud 115200
# laser.enable_dout 0
# laser.feed_pct 5.0
# laser.s_max 1000
# handwheel.a -1
# handwheel.b -1
# handwheel.ppr 100
# i2c_mpg.enable 0
# i2c_mpg.addr 0x20
# sd.enable 1
# sd.mosi 6
# sd.miso 4
# sd.sck 5
# sd.cs -1
# sd.dummy_cs 8
